<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Leads - Meta to Berdu (Cloud Edition)</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Mengekspos modul Firebase ke window agar bisa digunakan oleh React (Babel)
        window.FB = { 
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken, 
            getFirestore, doc, setDoc, updateDoc, deleteDoc, onSnapshot, collection 
        };
        // Memberikan sinyal bahwa Firebase siap
        window.dispatchEvent(new Event('firebase-modules-loaded'));
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' } }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Helper Function: Parsing Logic dari Berdu ---
        const parseBerduText = (text, adMappings = []) => {
            let ad_id = "";
            let campaign_id = "";
            let rawUrl = "";
            
            const urlRegex = /(https?:\/\/[^\s]+)/;
            const urlMatch = text.match(urlRegex);
            
            if (urlMatch) {
                rawUrl = urlMatch[0];
                try {
                    const urlObj = new URL(rawUrl);
                    ad_id = urlObj.searchParams.get('utm_content') || "Tidak ada ID";
                    campaign_id = urlObj.searchParams.get('utm_campaign') || "Tidak ada ID";
                } catch(e) { console.error("URL Invalid", e); }
            }

            const mappedAd = adMappings.find(m => m.id === ad_id);
            const ad_name = mappedAd ? mappedAd.name : null;

            const extractLine = (regex) => {
                const match = text.match(regex);
                return match && match[1] ? match[1].trim() : "";
            }

            const rawNominal = extractLine(/Pilih Nominal Infaq Anda:\s*(.+)/);
            let nominalNumber = "";
            let kategori = "";

            if (rawNominal) {
                let parts = [];
                if (rawNominal.includes("—")) parts = rawNominal.split("—");
                else if (rawNominal.includes("-")) parts = rawNominal.split("-");
                else parts = [rawNominal];

                const numPart = parts[0];
                kategori = parts.length > 1 ? parts.slice(1).join("-").trim() : "Tidak spesifik";
                nominalNumber = numPart.replace(/\D/g, '');
            }

            return {
                ad_id, ad_name, campaign_id, kategori, nominal: nominalNumber,
                sapaan: extractLine(/Sapaan:\s*(.+)/),
                nama_lengkap: extractLine(/Nama Lengkap:\s*(.+)/),
                no_wa: extractLine(/No\. WhatsApp:\s*(.+)/),
                doa: extractLine(/Tulis Doa Di Sini:\s*(.+)/),
                nama_ortu: extractLine(/Nama Orang Tua:\s*(.+)/),
                rawUrl
            };
        };

        // --- Helper Function: CSV Parser untuk Ekspor Meta Ads ---
        const parseCSV = (str) => {
            const arr = [];
            let quote = false;
            for (let row = 0, col = 0, c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || '';
                if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
                if (cc == '"') { quote = !quote; continue; }
                if (cc == ',' && !quote) { ++col; continue; }
                if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc == '\n' && !quote) { ++row; col = 0; continue; }
                if (cc == '\r' && !quote) { ++row; col = 0; continue; }
                arr[row][col] += cc;
            }
            return arr;
        };

        // --- Component: Notification Toast ---
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'success' ? 'bg-brand-600' : type === 'warning' ? 'bg-amber-500' : 'bg-red-500';
            const icon = type === 'success' ? 'ph-check-circle' : 'ph-warning-circle';

            return (
                <div className={`fixed bottom-4 right-4 ${bgColor} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 transition-all z-50 animate-bounce`}>
                    <i className={`${icon} text-xl`}></i>
                    <p className="font-medium text-sm">{message}</p>
                </div>
            );
        };

        const App = () => {
            // Firebase States
            const [fbApp, setFbApp] = useState(null);
            const [isCloudReady, setIsCloudReady] = useState(false);
            
            // App States
            const [leads, setLeads] = useState([]);
            const [adMappings, setAdMappings] = useState([]);
            const [adSpends, setAdSpends] = useState([]);
            
            // UI States
            const [rawText, setRawText] = useState("");
            const [parsedData, setParsedData] = useState(null);
            const [toast, setToast] = useState(null);
            const [activeTab, setActiveTab] = useState('leads');
            const [isDragging, setIsDragging] = useState(false);
            const [mappingModal, setMappingModal] = useState({ open: false, adId: '', adName: '' });

            const [newAdId, setNewAdId] = useState("");
            const [newAdName, setNewAdName] = useState("");
            const [newAdPlatform, setNewAdPlatform] = useState("Instagram");

            const [filterStart, setFilterStart] = useState(() => {
                const d = new Date(); d.setDate(1); return d.toISOString().split('T')[0];
            });
            const [filterEnd, setFilterEnd] = useState(() => new Date().toISOString().split('T')[0]);

            // App Constants
            const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'meta-berdu-crm-v2';

            useEffect(() => {
                const initFirebase = async () => {
                    // Cek jika lingkungan platform menyediakan config, jika tidak gunakan template manual untuk GitHub
                    const envConfig = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
                    
                    // JIKA DI GITHUB: Isi config di bawah ini dari Firebase Console Anda
                    const githubConfig = {
                        apiKey: "AIzaSyAgP7wTZpCNC6K74_EWWGvWKUudoMEX3dw",
                        authDomain: "lead-b8699.firebaseapp.com",
                        projectId: "lead-b8699",
                        storageBucket: "lead-b8699.firebasestorage.app",
                        messagingSenderId: "878245874778",
                        appId: "1:878245874778:web:7cd0ddf6e8c4c44070dc63"
                    };
                    
                    const finalConfig = envConfig ? JSON.parse(envConfig) : (githubConfig.apiKey ? githubConfig : null);

                    if (!finalConfig) {
                        setToast({ type: 'warning', message: 'Mode Offline: Konfigurasi Firebase belum diatur.' });
                        return; // Berhenti jika tidak ada konfigurasi database
                    }

                    try {
                        const app = window.FB.initializeApp(finalConfig);
                        const db = window.FB.getFirestore(app);
                        const auth = window.FB.getAuth(app);

                        // Wajib Auth sebelum Query (Rule 3)
                        if (typeof __initial_auth_token !== 'undefined') {
                            await window.FB.signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await window.FB.signInAnonymously(auth);
                        }
                        
                        setFbApp({ db, auth });
                        setIsCloudReady(true);
                        setToast({ type: 'success', message: 'Terhubung ke Cloud Database!' });
                    } catch(err) {
                        console.error("Gagal inisialisasi Firebase", err);
                        setToast({ type: 'error', message: 'Gagal terhubung ke server.' });
                    }
                };

                if (window.FB) {
                    initFirebase();
                } else {
                    window.addEventListener('firebase-modules-loaded', initFirebase);
                    return () => window.removeEventListener('firebase-modules-loaded', initFirebase);
                }
            }, []);

            useEffect(() => {
                if (!isCloudReady || !fbApp) return;

                const db = fbApp.db;
                
                // 1. Listen Leads
                const leadsRef = window.FB.collection(db, 'artifacts', APP_ID, 'public', 'data', 'leads');
                const unsubLeads = window.FB.onSnapshot(leadsRef, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    // Pengurutan dilakukan di memori (Rule 2)
                    data.sort((a, b) => b.created_at - a.created_at);
                    setLeads(data);
                }, (error) => console.error("Error Leads:", error));

                // 2. Listen Ad Mappings
                const mapRef = window.FB.collection(db, 'artifacts', APP_ID, 'public', 'data', 'adMappings');
                const unsubMap = window.FB.onSnapshot(mapRef, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setAdMappings(data);
                }, (error) => console.error("Error Mapping:", error));

                // 3. Listen Ad Spends
                const spendRef = window.FB.collection(db, 'artifacts', APP_ID, 'public', 'data', 'adSpends');
                const unsubSpend = window.FB.onSnapshot(spendRef, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setAdSpends(data);
                }, (error) => console.error("Error Spends:", error));

                return () => { unsubLeads(); unsubMap(); unsubSpend(); };
            }, [isCloudReady, fbApp]);

            useEffect(() => {
                if (rawText.trim().length > 10) {
                    const extracted = parseBerduText(rawText, adMappings);
                    const now = new Date();
                    const todayStr = now.toISOString().split('T')[0];
                    setParsedData(prev => ({
                        ...extracted,
                        id: prev?.id || Date.now().toString(),
                        status: prev?.status || 'Follow Up',
                        lead_date: prev?.lead_date || todayStr,
                        nominal_closing: prev?.nominal_closing || ""
                    }));
                } else {
                    setParsedData(null);
                }
            }, [rawText, adMappings]);

            const handleTextChange = (e) => setRawText(e.target.value);
            const handleFieldChange = (field, value) => setParsedData(prev => ({ ...prev, [field]: value }));

            const handleSave = async () => {
                if (!parsedData.nama_lengkap || !parsedData.no_wa) {
                    setToast({ type: 'error', message: 'Nama Lengkap & No WhatsApp wajib terisi!' });
                    return;
                }
                
                const mapped = adMappings.find(m => m.id === parsedData.ad_id);
                const finalData = {
                    ...parsedData,
                    ad_name: mapped ? mapped.name : (parsedData.ad_name || null),
                    created_at: Date.now() // Timestamp untuk sorting
                };
                
                if (isCloudReady) {
                    try {
                        const docRef = window.FB.doc(fbApp.db, 'artifacts', APP_ID, 'public', 'data', 'leads', finalData.id);
                        await window.FB.setDoc(docRef, finalData);
                        setToast({ type: 'success', message: 'Lead tersimpan di Cloud!' });
                    } catch (e) {
                        setToast({ type: 'error', message: 'Gagal menyimpan ke cloud.' });
                    }
                } else {
                    setToast({ type: 'error', message: 'Menunggu koneksi database...' });
                }

                setRawText("");
                setParsedData(null);
            };

            const updateStatus = async (id, newStatus) => {
                const lead = leads.find(l => l.id === id);
                if (!lead || !isCloudReady) return;

                let updates = { status: newStatus };
                if (newStatus === 'Closing' && !lead.nominal_closing) {
                    updates.nominal_closing = lead.nominal;
                }

                try {
                    const docRef = window.FB.doc(fbApp.db, 'artifacts', APP_ID, 'public', 'data', 'leads', id);
                    await window.FB.updateDoc(docRef, updates);
                } catch(e) { setToast({ type: 'error', message: 'Gagal update status' }); }
            };

            const updateLeadData = async (id, field, value) => {
                if (!isCloudReady) return;
                try {
                    const docRef = window.FB.doc(fbApp.db, 'artifacts', APP_ID, 'public', 'data', 'leads', id);
                    await window.FB.updateDoc(docRef, { [field]: value });
                } catch(e) { console.error(e); }
            };

            const deleteLead = async (id) => {
                if (!isCloudReady) return;
                try {
                    const docRef = window.FB.doc(fbApp.db, 'artifacts', APP_ID, 'public', 'data', 'leads', id);
                    await window.FB.deleteDoc(docRef);
                    setToast({ type: 'success', message: 'Lead dihapus dari Cloud.' });
                } catch(e) { setToast({ type: 'error', message: 'Gagal menghapus' }); }
            };

            const handleAddAdMapping = async (e) => {
                e?.preventDefault();
                if (!newAdId.trim() || !newAdName.trim()) {
                    setToast({ type: 'error', message: 'ID Iklan & Nama Iklan harus diisi!' }); return;
                }
                
                if (isCloudReady) {
                    try {
                        const docId = newAdId.trim();
                        const docRef = window.FB.doc(fbApp.db, 'artifacts', APP_ID, 'public', 'data', 'adMappings', docId);
                        await window.FB.setDoc(docRef, { id: docId, name: newAdName.trim(), platform: newAdPlatform });
                        setToast({ type: 'success', message: 'Master Iklan berhasil disimpan!' });
                        setNewAdId(""); setNewAdName("");
                    } catch(e) { setToast({ type: 'error', message: 'Gagal menyimpan mapping' }); }
                }
            };

            const handleQuickSaveMapping = async () => {
                if (!mappingModal.adName.trim() || !isCloudReady) return;
                
                try {
                    const docRef = window.FB.doc(fbApp.db, 'artifacts', APP_ID, 'public', 'data', 'adMappings', mappingModal.adId);
                    await window.FB.setDoc(docRef, { id: mappingModal.adId, name: mappingModal.adName.trim(), platform: 'Meta Ads' });
                    setToast({ type: 'success', message: `Iklan berhasil diberi nama!` });
                    setMappingModal({ open: false, adId: '', adName: '' });
                } catch(e) { setToast({ type: 'error', message: 'Gagal menyimpan nama' }); }
            };

            const handleDeleteAdMapping = async (id) => {
                if (!isCloudReady) return;
                try {
                    const docRef = window.FB.doc(fbApp.db, 'artifacts', APP_ID, 'public', 'data', 'adMappings', id);
                    await window.FB.deleteDoc(docRef);
                    setToast({ type: 'success', message: 'Mapping Iklan dihapus.' });
                } catch(e) {}
            };

            const getAdDisplayName = (adId) => {
                const found = adMappings.find(m => m.id === adId);
                return found ? found.name : null;
            };

            const handleDeleteSpend = async (id) => {
                if (!isCloudReady) return;
                try {
                    const docRef = window.FB.doc(fbApp.db, 'artifacts', APP_ID, 'public', 'data', 'adSpends', id);
                    await window.FB.deleteDoc(docRef);
                    setToast({ type: 'success', message: 'Data biaya dihapus.' });
                } catch(e) {}
            };

            const handleImportCSV = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (event) => {
                    const text = event.target.result;
                    const parsedCsv = parseCSV(text);
                    if (parsedCsv.length < 2) { setToast({ type: 'error', message: 'CSV kosong atau format salah.' }); return; }

                    let headerRowIdx = -1;
                    let headers = [];
                    for (let i = 0; i < Math.min(parsedCsv.length, 5); i++) {
                        const rowData = parsedCsv[i].map(h => h ? h.toString().toLowerCase().trim().replace(/[\u200B-\u200D\uFEFF]/g, '') : '');
                        const hasAdId = rowData.some(h => h.includes('ad id') || h.includes('id iklan') || h === 'ad_id');
                        const hasSpend = rowData.some(h => h.includes('spent') || h.includes('spend') || h.includes('dibelanjakan') || h.includes('amount'));
                        
                        if (hasAdId && hasSpend) { headerRowIdx = i; headers = rowData; break; }
                    }

                    if (headerRowIdx === -1) { setToast({ type: 'error', message: 'Format tidak dikenali! Gagal menemukan kolom ID Iklan & Dibelanjakan.' }); return; }

                    const dateIdx = headers.findIndex(h => h.includes('awal pelaporan') || h.includes('reporting starts') || h.includes('tanggal') || h.includes('mulai pelaporan'));
                    const adIdIdx = headers.findIndex(h => h.includes('ad id') || h.includes('id iklan') || h === 'ad_id');
                    const spendIdx = headers.findIndex(h => h.includes('spent') || h.includes('spend') || h.includes('dibelanjakan'));
                    const adNameIdx = headers.findIndex(h => h.includes('ad name') || h.includes('nama iklan'));

                    let importedCount = 0;
                    
                    if (!isCloudReady) { setToast({ type: 'error', message: 'Koneksi Cloud terputus, tidak bisa import' }); return; }

                    // Process rows
                    for (let i = headerRowIdx + 1; i < parsedCsv.length; i++) {
                        const row = parsedCsv[i];
                        if (row.length <= Math.max(adIdIdx, spendIdx)) continue;
                        
                        let adId = row[adIdIdx] ? row[adIdIdx].replace(/[^0-9]/g, '') : "";
                        if (!adId) continue; 

                        let rawDate = (dateIdx !== -1 && row[dateIdx]) ? row[dateIdx].trim().split(' ')[0] : new Date().toISOString().split('T')[0];
                        if (rawDate.includes('/')) {
                            const p = rawDate.split('/');
                            if(p.length === 3) rawDate = p[2].length === 4 ? `${p[2]}-${p[1].padStart(2, '0')}-${p[0].padStart(2, '0')}` : `${p[0]}-${p[1].padStart(2, '0')}-${p[2].padStart(2, '0')}`;
                        } else if (rawDate.includes('-')) {
                            const p = rawDate.split('-');
                            if(p.length === 3) rawDate = p[2].length === 4 ? `${p[2]}-${p[1].padStart(2, '0')}-${p[0].padStart(2, '0')}` : `${p[0]}-${p[1].padStart(2, '0')}-${p[2].padStart(2, '0')}`;
                        }

                        let rawSpend = row[spendIdx] ? row[spendIdx].toString().replace(/[^0-9,.]/g, '') : "0";
                        if (rawSpend.includes(',') && rawSpend.includes('.')) {
                            rawSpend = rawSpend.indexOf(',') > rawSpend.indexOf('.') ? rawSpend.replace(/\./g, '').replace(',', '.') : rawSpend.replace(/,/g, '');
                        } else if (rawSpend.includes(',')) {
                            rawSpend = rawSpend.match(/,\d{1,2}$/) ? rawSpend.replace(',', '.') : rawSpend.replace(/,/g, '');
                        } else if (rawSpend.includes('.')) {
                            if (rawSpend.match(/\.\d{3,}$/)) rawSpend = rawSpend.replace(/\./g, '');
                        }
                        
                        const spendVal = parseFloat(rawSpend) || 0;
                        let adName = (adNameIdx !== -1 && row[adNameIdx]) ? row[adNameIdx].trim() : "";

                        if (spendVal >= 0) {
                            // Unique ID: Date + AdID
                            const spendDocId = `${rawDate}_${adId}`;
                            const docRef = window.FB.doc(fbApp.db, 'artifacts', APP_ID, 'public', 'data', 'adSpends', spendDocId);
                            await window.FB.setDoc(docRef, { id: spendDocId, date: rawDate, ad_id: adId, amount: spendVal });
                            importedCount++;
                        }

                        if (adId && adName && !adMappings.some(m => m.id === adId)) {
                            const mapRef = window.FB.doc(fbApp.db, 'artifacts', APP_ID, 'public', 'data', 'adMappings', adId);
                            await window.FB.setDoc(mapRef, { id: adId, name: adName, platform: 'Meta Ads' });
                        }
                    }

                    if (importedCount > 0) setToast({ type: 'success', message: `${importedCount} baris data biaya disinkronkan ke Cloud!` });
                    else setToast({ type: 'error', message: 'Data CSV tidak valid.' });
                };
                reader.readAsText(file);
                e.target.value = null; 
            };

            const filteredLeads = leads.filter(lead => {
                const lDate = lead.lead_date || lead.dateOnly; 
                if (filterStart && lDate < filterStart) return false;
                if (filterEnd && lDate > filterEnd) return false;
                return true;
            });

            const filteredSpends = adSpends.filter(spend => {
                if (filterStart && spend.date < filterStart) return false;
                if (filterEnd && spend.date > filterEnd) return false;
                return true;
            });

            const totalLeads = filteredLeads.length;
            const totalClosing = filteredLeads.filter(l => l.status === 'Closing').length;
            const totalFollowUp = filteredLeads.filter(l => l.status === 'Follow Up').length;
            const totalLost = filteredLeads.filter(l => l.status === 'Lost').length;
            const totalRevenue = filteredLeads.filter(l => l.status === 'Closing').reduce((acc, l) => acc + (parseInt(l.nominal_closing || l.nominal) || 0), 0);
            
            const totalAdSpend = filteredSpends.reduce((acc, s) => acc + s.amount, 0);
            const totalROAS = totalAdSpend > 0 ? (totalRevenue / totalAdSpend).toFixed(2) : (totalRevenue > 0 ? '∞' : '0.00');

            const allDates = new Set([
                ...filteredLeads.map(l => l.lead_date || l.dateOnly || "Tanpa Tanggal"),
                ...filteredSpends.map(s => s.date)
            ]);

            const dateStats = Array.from(allDates).filter(Boolean).map(dateKey => {
                const l = filteredLeads.filter(x => (x.lead_date || x.dateOnly || "Tanpa Tanggal") === dateKey);
                const s = filteredSpends.filter(x => x.date === dateKey);
                
                const total = l.length;
                const closing = l.filter(x => x.status === 'Closing').length;
                const revenue = l.filter(x => x.status === 'Closing').reduce((acc, x) => acc + (parseInt(x.nominal_closing || x.nominal) || 0), 0);
                const spend = s.reduce((acc, x) => acc + x.amount, 0);
                const roas = spend > 0 ? (revenue / spend).toFixed(2) : (revenue > 0 ? '∞' : '0.00');

                return { date: dateKey, total, closing, revenue, spend, roas };
            }).sort((a, b) => new Date(b.date) - new Date(a.date));

            const groupedAds = {};

            // Fungsi penentu nama grup
            const resolveGroupName = (adId, fallbackName) => {
                const mappedName = getAdDisplayName(adId);
                if (mappedName) return mappedName; 
                if (fallbackName) return fallbackName;
                return `Belum Terpetakan (ID: ${adId})`;
            };

            filteredLeads.forEach(lead => {
                const gName = resolveGroupName(lead.ad_id, lead.ad_name);
                if (!groupedAds[gName]) {
                    groupedAds[gName] = { adName: gName, adIds: new Set(), total: 0, closing: 0, followUp: 0, lost: 0, revenue: 0, spend: 0 };
                }
                if (lead.ad_id && lead.ad_id !== "Tidak ada ID" && lead.ad_id !== "Organic") {
                    groupedAds[gName].adIds.add(lead.ad_id);
                }
                groupedAds[gName].total += 1;

                                                                <h3 className="font-bold text-gray-800 text-lg mb-1">{lead.sapaan ? `${lead.sapaan} ` : ''}{lead.nama_lengkap}</h3>
                                                                <p className="text-xs text-gray-500 mb-3"><i className="ph ph-calendar"></i> Tgl Lead: <strong>{lead.lead_date || lead.dateOnly}</strong></p>
                                                                
                                                                <div className="grid grid-cols-2 gap-4 text-sm bg-gray-50 p-3 rounded-lg border mb-2"><div><span className="block text-xs text-gray-400">Nominal Awal</span><span className="font-semibold">{formatRupiah(lead.nominal)}</span></div><div><span className="block text-xs text-gray-400">No. WhatsApp</span><span className="font-semibold text-blue-600">{lead.no_wa}</span></div></div>
                                                                
                                                                {(lead.nama_ortu || lead.doa) && (
                                                                    <div className="text-xs bg-brand-50 p-3 rounded-lg border border-brand-100 mb-2 space-y-1">
                                                                        {lead.nama_ortu && <div><span className="font-semibold text-brand-700">Ortu:</span> <span className="text-gray-700">{lead.nama_ortu}</span></div>}
                                                                        {lead.doa && <div><span className="font-semibold text-brand-700">Doa:</span> <span className="text-gray-700 italic">"{lead.doa}"</span></div>}
                                                                    </div>
                                                                )}

                                                                {lead.status === 'Closing' && (<div className="mt-3 bg-emerald-50 p-3 rounded-lg border border-emerald-200 flex justify-between gap-3"><div><span className="block text-xs font-bold text-emerald-700">Nominal Closing Aktual</span></div><input type="number" value={lead.nominal_closing || lead.nominal || ''} onChange={(e) => updateLeadData(lead.id, 'nominal_closing', e.target.value)} className="w-32 border rounded-lg p-2 text-sm font-semibold text-right" placeholder="0"/></div>)}
                                                            </div>
                                                            <div className="w-full md:w-48 shrink-0 flex flex-col gap-2"><label className="text-xs font-semibold text-gray-500">Status Lead</label>
                                                                <select value={lead.status} onChange={(e) => updateStatus(lead.id, e.target.value)} className={`w-full border rounded-xl p-2.5 text-sm font-semibold outline-none ${lead.status === 'Follow Up' ? 'bg-yellow-50 text-yellow-700' : lead.status === 'Closing' ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'}`}><option value="Follow Up">⏳ Follow Up</option><option value="Closing">✅ Closing</option><option value="Lost">❌ Lost</option></select>
                                                            </div></div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {}
                    {mappingModal.open && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl w-full max-w-md p-6"><h3 className="text-lg font-bold text-gray-800 mb-4">Beri Nama Iklan</h3><div className="mb-4"><label className="block text-xs font-semibold text-gray-700 mb-1">Nama Konten Iklan</label><input type="text" value={mappingModal.adName} onChange={e => setMappingModal(prev => ({ ...prev, adName: e.target.value }))} className="w-full border rounded-xl p-2.5 text-sm" autoFocus/></div><div className="flex justify-end gap-2"><button onClick={() => setMappingModal({ open: false, adId: '', adName: '' })} className="px-4 py-2 rounded-xl text-xs font-semibold bg-gray-100">Batal</button><button onClick={handleQuickSaveMapping} className="px-4 py-2 rounded-xl text-xs font-semibold bg-brand-600 text-white">Simpan</button></div></div>
                        </div>
                    )}
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Leads - Meta to Berdu (Cloud Edition)</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Mengekspos modul Firebase ke window
        window.FB = { 
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken, 
            signInWithEmailAndPassword, signOut, onAuthStateChanged,
            getFirestore, doc, setDoc, updateDoc, deleteDoc, onSnapshot, collection 
        };
        window.dispatchEvent(new Event('firebase-modules-loaded'));
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' } }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const parseBerduText = (text, adMappings = []) => {
            let ad_id = "";
            let campaign_id = "";
            let rawUrl = "";
            
            const urlRegex = /(https?:\/\/[^\s]+)/;
            const urlMatch = text.match(urlRegex);
            
            if (urlMatch) {
                rawUrl = urlMatch[0];
                try {
                    const urlObj = new URL(rawUrl);
                    ad_id = urlObj.searchParams.get('utm_content') || "Tidak ada ID";
                    campaign_id = urlObj.searchParams.get('utm_campaign') || "Tidak ada ID";
                } catch(e) { console.error("URL Invalid", e); }
            }

            // Temukan mapping berdasarkan array ID yang sudah disatukan
            const mappedAd = adMappings.find(m => m.mappedIds && m.mappedIds.includes(ad_id));
            const ad_name = mappedAd ? mappedAd.name : null;

            const extractLine = (regex) => {
                const match = text.match(regex);
                return match && match[1] ? match[1].trim() : "";
            }

            const rawNominal = extractLine(/Pilih Nominal Infaq Anda:\s*(.+)/);
            let nominalNumber = "";
            let kategori = "";

            if (rawNominal) {
                let parts = [];
                if (rawNominal.includes("—")) parts = rawNominal.split("—");
                else if (rawNominal.includes("-")) parts = rawNominal.split("-");
                else parts = [rawNominal];

                const numPart = parts[0];
                kategori = parts.length > 1 ? parts.slice(1).join("-").trim() : "Tidak spesifik";
                nominalNumber = numPart.replace(/\D/g, '');
            }

            return {
                ad_id, ad_name, campaign_id, kategori, nominal: nominalNumber,
                sapaan: extractLine(/Sapaan:\s*(.+)/),
                nama_lengkap: extractLine(/Nama Lengkap:\s*(.+)/),
                no_wa: extractLine(/No\. WhatsApp:\s*(.+)/),
                doa: extractLine(/Tulis Doa Di Sini:\s*(.+)/),
                nama_ortu: extractLine(/Nama Orang Tua:\s*(.+)/),
                rawUrl
            };
        };

        const parseCSV = (str) => {
            const arr = [];
            let quote = false;
            for (let row = 0, col = 0, c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || '';
                if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
                if (cc == '"') { quote = !quote; continue; }
                if (cc == ',' && !quote) { ++col; continue; }
                if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc == '\n' && !quote) { ++row; col = 0; continue; }
                if (cc == '\r' && !quote) { ++row; col = 0; continue; }
                arr[row][col] += cc;
            }
            return arr;
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);
            const bgColor = type === 'success' ? 'bg-brand-600' : type === 'warning' ? 'bg-amber-500' : 'bg-red-500';
            const icon = type === 'success' ? 'ph-check-circle' : 'ph-warning-circle';
            return (
                <div className={`fixed bottom-4 right-4 ${bgColor} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 transition-all z-50 animate-bounce`}>
                    <i className={`${icon} text-xl`}></i><p className="font-medium text-sm">{message}</p>
                </div>
            );
        };

        const App = () => {
            const [fbApp, setFbApp] = useState(null);
            const [isCloudReady, setIsCloudReady] = useState(false);
            
            // Auth States
            const [user, setUser] = useState(null);
            const [isCheckingAuth, setIsCheckingAuth] = useState(true);
            const [loginEmail, setLoginEmail] = useState("");
            const [loginPassword, setLoginPassword] = useState("");
            const [loginLoading, setLoginLoading] = useState(false);
            
            const [leads, setLeads] = useState([]);
            const [rawAdMappings, setRawAdMappings] = useState([]); // Raw dari DB
            const [adSpends, setAdSpends] = useState([]);
            
            const [rawText, setRawText] = useState("");
            const [parsedData, setParsedData] = useState(null);
            const [toast, setToast] = useState(null);
            const [activeTab, setActiveTab] = useState('leads');
            const [isDragging, setIsDragging] = useState(false);
            const [mappingModal, setMappingModal] = useState({ open: false, adId: '', adName: '' });

            const [newAdId, setNewAdId] = useState("");
            const [newAdName, setNewAdName] = useState("");

            const [filterStart, setFilterStart] = useState(() => {
                const d = new Date(); d.setDate(1); return d.toISOString().split('T')[0];
            });
            const [filterEnd, setFilterEnd] = useState(() => new Date().toISOString().split('T')[0]);

            const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'meta-berdu-crm-v2';

            useEffect(() => {
                const initFirebase = async () => {
                    const envConfig = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
                    
                    // JIKA DI GITHUB: Pastikan Config ini diisi sesuai akun Firebase Anda
                    const githubConfig = {
                        apiKey: "AIzaSyAgP7wTZpCNC6K74_EWWGvWKUudoMEX3dw",
                        authDomain: "lead-b8699.firebaseapp.com",
                        projectId: "lead-b8699",
                        storageBucket: "lead-b8699.firebasestorage.app",
                        messagingSenderId: "878245874778",
                        appId: "1:878245874778:web:7cd0ddf6e8c4c44070dc63"
                    };
                    
                    const finalConfig = envConfig ? JSON.parse(envConfig) : githubConfig;

                    if (!finalConfig.apiKey) {
                        setToast({ type: 'warning', message: 'Konfigurasi Firebase belum diatur.' });
                        setIsCheckingAuth(false);
                        return; 
                    }

                    try {
                        const app = window.FB.initializeApp(finalConfig);
                        const db = window.FB.getFirestore(app);
                        const auth = window.FB.getAuth(app);
                        
                        setFbApp({ db, auth });

                        // Logika Auth: Bypass Otomatis hanya untuk Immersive Web App
                        if (typeof __initial_auth_token !== 'undefined') {
                            await window.FB.signInWithCustomToken(auth, __initial_auth_token);
                        }
                        
                        // Listener status login
                        window.FB.onAuthStateChanged(auth, (currentUser) => {
                            if (currentUser) {
                                setUser(currentUser);
                                setIsCloudReady(true);
                            } else {
                                setUser(null);
                                setIsCloudReady(false);
                            }
                            setIsCheckingAuth(false);
                        });

                    } catch(err) {
                        console.error("Gagal inisialisasi Firebase", err);
                        setToast({ type: 'error', message: 'Gagal inisialisasi sistem.' });
                        setIsCheckingAuth(false);
                    }
                };

                if (window.FB) initFirebase();
                else window.addEventListener('firebase-modules-loaded', initFirebase);
                return () => window.removeEventListener('firebase-modules-loaded', initFirebase);
            }, []);

            useEffect(() => {
                if (!isCloudReady || !fbApp || !user) return;

                const db = fbApp.db;
                
                const leadsRef = window.FB.collection(db, 'artifacts', APP_ID, 'public', 'data', 'leads');
                const unsubLeads = window.FB.onSnapshot(leadsRef, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    data.sort((a, b) => b.created_at - a.created_at);
                    setLeads(data);
                }, (e) => console.error(e));

                const mapRef = window.FB.collection(db, 'artifacts', APP_ID, 'public', 'data', 'adMappings');
                const unsubMap = window.FB.onSnapshot(mapRef, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setRawAdMappings(data);
                }, (e) => console.error(e));

                const spendRef = window.FB.collection(db, 'artifacts', APP_ID, 'public', 'data', 'adSpends');
                const unsubSpend = window.FB.onSnapshot(spendRef, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setAdSpends(data);
                }, (e) => console.error(e));

                return () => { unsubLeads(); unsubMap(); unsubSpend(); };
            }, [isCloudReady, fbApp, user]);

            // --- Fungsi Autentikasi (Login & Logout) ---
            const handleLogin = async (e) => {
                e.preventDefault();
                setLoginLoading(true);
                try {
                    await window.FB.signInWithEmailAndPassword(fbApp.auth, loginEmail, loginPassword);
                    setToast({ type: 'success', message: 'Login Berhasil!' });
                } catch (error) {
                    let msg = "Gagal login. Periksa email/password Anda.";
                    if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') msg = "Email atau Password salah!";
                    else if (error.code === 'auth/invalid-email') msg = "Format email tidak valid.";
                    setToast({ type: 'error', message: msg });
                }
                setLoginLoading(false);
            };

            const handleLogout = async () => {
                try {
                    await window.FB.signOut(fbApp.auth);
                    setToast({ type: 'success', message: 'Berhasil Keluar.' });
                } catch(e) {}
            };

            // --- Logika Penyatuan ID berdasarkan Nama ---
            const adMappings = React.useMemo(() => {
                const grouped = {};
                rawAdMappings.forEach(item => {
                    const nameKey = item.name.trim().toLowerCase();
                    if (!grouped[nameKey]) grouped[nameKey] = { name: item.name, mappedIds: [] };
                    grouped[nameKey].mappedIds.push(item.id);
                });
                return Object.values(grouped); 
            }, [rawAdMappings]);

            const getAdDisplayName = (adId) => {
                const found = adMappings.find(m => m.mappedIds.includes(adId));
                return found ? found.name : null;
            };

            useEffect(() => {
                if (rawText.trim().length > 10) {
                    const extracted = parseBerduText(rawText, adMappings);
                    const now = new Date();
                    const todayStr = now.toISOString().split('T')[0];
                    setParsedData(prev => ({
                        ...extracted,
                        id: prev?.id || Date.now().toString(),
                        status: prev?.status || 'Follow Up',
                        lead_date: prev?.lead_date || todayStr,
                        nominal_closing: prev?.nominal_closing || ""
                    }));
                } else {
                    setParsedData(null);
                }
            }, [rawText, adMappings]);

            const handleTextChange = (e) => setRawText(e.target.value);
            const handleFieldChange = (field, value) => setParsedData(prev => ({ ...prev, [field]: value }));

            const handleSave = async () => {
                if (!parsedData.nama_lengkap || !parsedData.no_wa) { setToast({ type: 'error', message: 'Nama Lengkap & No WhatsApp wajib terisi!' }); return; }
                const mappedName = getAdDisplayName(parsedData.ad_id);
                const finalData = { ...parsedData, ad_name: mappedName || (parsedData.ad_name || null), created_at: Date.now() };
                
                if (isCloudReady) {
                    try {
                        const docRef = window.FB.doc(fbApp.db, 'artifacts', APP_ID, 'public', 'data', 'leads', finalData.id);
                        await window.FB.setDoc(docRef, finalData);
                        setToast({ type: 'success', message: 'Lead tersimpan di Cloud!' });
                    } catch (e) { setToast({ type: 'error', message: 'Gagal menyimpan ke cloud.' }); }
                }
                setRawText(""); setParsedData(null);
            };

            const updateStatus = async (id, newStatus) => {
                const lead = leads.find(l => l.id === id);
                if (!lead || !isCloudReady) return;
                let updates = { status: newStatus };
                if (newStatus === 'Closing') {
                    if (!lead.nominal_closing) updates.nominal_closing = lead.nominal;
                    if (!lead.tanggal_closing) updates.tanggal_closing = new Date().toISOString().split('T')[0];
                }
                try {
                    const docRef = window.FB.doc(fbApp.db, 'artifacts', APP_ID, 'public', 'data', 'leads', id);
                    await window.FB.updateDoc(docRef, updates);
                } catch(e) { setToast({ type: 'error', message: 'Gagal update status' }); }
            };

            const updateLeadData = async (id, field, value) => {
                if (!isCloudReady) return;
                try {
                    const docRef = window.FB.doc(fbApp.db, 'artifacts', APP_ID, 'public', 'data', 'leads', id);
                    await window.FB.updateDoc(docRef, { [field]: value });
                } catch(e) {}
            };

            const deleteLead = async (id) => {
                if (!isCloudReady) return;
                try {
                    const docRef = window.FB.doc(fbApp.db, 'artifacts', APP_ID, 'public', 'data', 'leads', id);
                    await window.FB.deleteDoc(docRef);
                    setToast({ type: 'success', message: 'Lead dihapus.' });
                } catch(e) {}
            };

            const handleAddAdMapping = async (e, forceId, forceName) => {
                if (e) e.preventDefault();
                const idToSave = forceId || newAdId;
                const nameToSave = forceName || newAdName;
                if (!idToSave.trim() || !nameToSave.trim()) { setToast({ type: 'error', message: 'ID Iklan & Nama harus diisi!' }); return; }
                if (isCloudReady) {
                    try {
                        const docId = idToSave.trim();
                        const docRef = window.FB.doc(fbApp.db, 'artifacts', APP_ID, 'public', 'data', 'adMappings', docId);
                        await window.FB.setDoc(docRef, { id: docId, name: nameToSave.trim(), platform: 'Meta Ads' });
                        if(!forceId) { setToast({ type: 'success', message: 'Master Iklan disimpan!' }); setNewAdId(""); setNewAdName(""); }
                    } catch(err) { setToast({ type: 'error', message: 'Gagal menyimpan mapping' }); }
                }
            };

            const handleQuickSaveMapping = async () => {
                if (!mappingModal.adName.trim()) return;
                await handleAddAdMapping(null, mappingModal.adId, mappingModal.adName);
                setToast({ type: 'success', message: `Iklan berhasil diberi nama!` });
                setMappingModal({ open: false, adId: '', adName: '' });
            };

            const handleDeleteAdMapping = async (id) => {
                if (!isCloudReady) return;
                try {
                    const docRef = window.FB.doc(fbApp.db, 'artifacts', APP_ID, 'public', 'data', 'adMappings', id);
                    await window.FB.deleteDoc(docRef);
                    setToast({ type: 'success', message: 'Mapping Iklan dihapus.' });
                } catch(e) {}
            };

            const handleDeleteSpend = async (id) => {
                if (!isCloudReady) return;
                try {
                    const docRef = window.FB.doc(fbApp.db, 'artifacts', APP_ID, 'public', 'data', 'adSpends', id);
                    await window.FB.deleteDoc(docRef);
                    setToast({ type: 'success', message: 'Data biaya dihapus.' });
                } catch(e) {}
            };

            const handleImportCSV = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (event) => {
                    const text = event.target.result;
                    const parsedCsv = parseCSV(text);
                    if (parsedCsv.length < 2) { setToast({ type: 'error', message: 'CSV kosong atau format salah.' }); return; }

                    let headerRowIdx = -1;
                    let headers = [];
                    for (let i = 0; i < Math.min(parsedCsv.length, 5); i++) {
                        const rowData = parsedCsv[i].map(h => h ? h.toString().toLowerCase().trim().replace(/[\u200B-\u200D\uFEFF]/g, '') : '');
                        const hasAdId = rowData.some(h => h.includes('ad id') || h.includes('id iklan') || h === 'ad_id');
                        const hasSpend = rowData.some(h => h.includes('spent') || h.includes('spend') || h.includes('dibelanjakan') || h.includes('amount'));
                        if (hasAdId && hasSpend) { headerRowIdx = i; headers = rowData; break; }
                    }

                    if (headerRowIdx === -1) { setToast({ type: 'error', message: 'Format tidak dikenali! Gagal menemukan kolom "ID Iklan" & "Dibelanjakan".' }); return; }

                    const dateIdx = headers.findIndex(h => h.includes('awal pelaporan') || h.includes('reporting starts') || h.includes('tanggal') || h.includes('mulai pelaporan'));
                    const adIdIdx = headers.findIndex(h => h.includes('ad id') || h.includes('id iklan') || h === 'ad_id');
                    const spendIdx = headers.findIndex(h => h.includes('spent') || h.includes('spend') || h.includes('dibelanjakan'));
                    const adNameIdx = headers.findIndex(h => h.includes('ad name') || h.includes('nama iklan'));

                    let importedCount = 0;
                    if (!isCloudReady) { setToast({ type: 'error', message: 'Koneksi terputus, gagal impor.' }); return; }

                    for (let i = headerRowIdx + 1; i < parsedCsv.length; i++) {
                        const row = parsedCsv[i];
                        if (row.length <= Math.max(adIdIdx, spendIdx)) continue;
                        
                        let adId = row[adIdIdx] ? row[adIdIdx].replace(/[^0-9]/g, '') : "";
                        if (!adId) continue; 

                        let rawDate = (dateIdx !== -1 && row[dateIdx]) ? row[dateIdx].trim().split(' ')[0] : new Date().toISOString().split('T')[0];
                        
                        if (rawDate.includes('/')) {
                            const p = rawDate.split('/');
                            if(p.length === 3) rawDate = p[2].length === 4 ? `${p[2]}-${p[1].padStart(2, '0')}-${p[0].padStart(2, '0')}` : `${p[0]}-${p[1].padStart(2, '0')}-${p[2].padStart(2, '0')}`;
                        } else if (rawDate.includes('-')) {
                            const p = rawDate.split('-');
                            if(p.length === 3) rawDate = p[2].length === 4 ? `${p[2]}-${p[1].padStart(2, '0')}-${p[0].padStart(2, '0')}` : `${p[0]}-${p[1].padStart(2, '0')}-${p[2].padStart(2, '0')}`;
                        }
                        if (!rawDate.match(/^\d{4}-\d{2}-\d{2}$/)) rawDate = new Date().toISOString().split('T')[0]; // Fallback if messed up

                        let rawSpend = row[spendIdx] ? row[spendIdx].toString().replace(/[^0-9,.-]/g, '') : "0";
                        if (rawSpend.includes(',') && rawSpend.includes('.')) {
                            rawSpend = rawSpend.indexOf(',') > rawSpend.indexOf('.') ? rawSpend.replace(/\./g, '').replace(',', '.') : rawSpend.replace(/,/g, '');
                        } else if (rawSpend.includes(',')) {
                            rawSpend = rawSpend.match(/,\d{1,2}$/) ? rawSpend.replace(',', '.') : rawSpend.replace(/,/g, '');
                        } else if (rawSpend.includes('.')) {
                            if (rawSpend.match(/\.\d{3,}$/)) rawSpend = rawSpend.replace(/\./g, '');
                        }
                        
                        const spendVal = parseFloat(rawSpend) || 0;
                        let adName = (adNameIdx !== -1 && row[adNameIdx]) ? row[adNameIdx].trim() : "";

                        if (spendVal >= 0) {
                            const spendDocId = `${rawDate}_${adId}`;
                            const docRef = window.FB.doc(fbApp.db, 'artifacts', APP_ID, 'public', 'data', 'adSpends', spendDocId);
                            await window.FB.setDoc(docRef, { id: spendDocId, date: rawDate, ad_id: adId, amount: spendVal });
                            importedCount++;
                        }

                        if (adId && adName && !rawAdMappings.some(m => m.id === adId)) {
                            const mapRef = window.FB.doc(fbApp.db, 'artifacts', APP_ID, 'public', 'data', 'adMappings', adId);
                            await window.FB.setDoc(mapRef, { id: adId, name: adName, platform: 'Meta Ads' });
                        }
                    }
                    if (importedCount > 0) setToast({ type: 'success', message: `${importedCount} data biaya disinkronkan ke Cloud!` });
                    else setToast({ type: 'error', message: 'Data CSV tidak valid atau kosong.' });
                };
                reader.readAsText(file);
                e.target.value = null; 
            };

            // 1. Filter Leads yang MASUK dalam rentang tanggal
            const leadsGeneratedInRange = leads.filter(l => {
                const lDate = l.lead_date || l.dateOnly;
                if (filterStart && lDate < filterStart) return false;
                if (filterEnd && lDate > filterEnd) return false;
                return true;
            });

            // 2. Filter Leads yang CLOSING dalam rentang tanggal (Pisah Logika)
            const leadsClosedInRange = leads.filter(l => {
                if (l.status !== 'Closing') return false;
                const cDate = l.tanggal_closing || l.lead_date || l.dateOnly;
                if (filterStart && cDate < filterStart) return false;
                if (filterEnd && cDate > filterEnd) return false;
                return true;
            });

            // 3. Filter Biaya Iklan dalam rentang tanggal
            const spendsInRange = adSpends.filter(spend => {
                if (filterStart && spend.date < filterStart) return false;
                if (filterEnd && spend.date > filterEnd) return false;
                return true;
            });

            // --- Top Dashboard Stats ---
            const totalLeads = leadsGeneratedInRange.length;
            const totalFollowUp = leadsGeneratedInRange.filter(l => l.status === 'Follow Up').length;
            const totalLost = leadsGeneratedInRange.filter(l => l.status === 'Lost').length;
            
            const totalClosing = leadsClosedInRange.length;
            const totalRevenue = leadsClosedInRange.reduce((acc, l) => acc + (parseInt(l.nominal_closing || l.nominal) || 0), 0);
            
            const totalAdSpend = spendsInRange.reduce((acc, s) => acc + s.amount, 0);
            const totalROAS = totalAdSpend > 0 ? (totalRevenue / totalAdSpend).toFixed(2) : (totalRevenue > 0 ? '∞' : '0.00');

            // --- Performa Harian (Daily Stats) ---
            const allDates = new Set([
                ...leadsGeneratedInRange.map(l => l.lead_date || l.dateOnly || "Tanpa Tanggal"),
                ...leadsClosedInRange.map(l => l.tanggal_closing || l.lead_date || l.dateOnly || "Tanpa Tanggal"),
                ...spendsInRange.map(s => s.date)
            ]);

            const dateStats = Array.from(allDates).filter(Boolean).map(dateKey => {
                const total = leadsGeneratedInRange.filter(x => (x.lead_date || x.dateOnly || "Tanpa Tanggal") === dateKey).length;
                
                const closedLeads = leadsClosedInRange.filter(x => (x.tanggal_closing || x.lead_date || x.dateOnly || "Tanpa Tanggal") === dateKey);
                const closing = closedLeads.length;
                const revenue = closedLeads.reduce((acc, x) => acc + (parseInt(x.nominal_closing || x.nominal) || 0), 0);
                
                const spend = spendsInRange.filter(x => x.date === dateKey).reduce((acc, x) => acc + x.amount, 0);
                const roas = spend > 0 ? (revenue / spend).toFixed(2) : (revenue > 0 ? '∞' : '0.00');
                
                return { date: dateKey, total, closing, revenue, spend, roas };
            }).sort((a, b) => new Date(b.date) - new Date(a.date));

            // --- Kinerja Konten Iklan (Ad Stats) ---
            const groupedAds = {};
            const resolveGroupName = (adId, fallbackName) => {
                const mappedName = getAdDisplayName(adId);
                return mappedName || fallbackName || `Belum Terpetakan (ID: ${adId})`;
            };

            // Leads masuk dialokasikan ke total, follow up, lost
            leadsGeneratedInRange.forEach(lead => {
                const gName = resolveGroupName(lead.ad_id, lead.ad_name);
                if (!groupedAds[gName]) groupedAds[gName] = { adName: gName, adIds: new Set(), total: 0, closing: 0, followUp: 0, lost: 0, revenue: 0, spend: 0 };
                if (lead.ad_id && lead.ad_id !== "Tidak ada ID" && lead.ad_id !== "Organic") groupedAds[gName].adIds.add(lead.ad_id);
                
                groupedAds[gName].total += 1;
                if (lead.status === 'Follow Up') groupedAds[gName].followUp += 1;
                else if (lead.status === 'Lost') groupedAds[gName].lost += 1;
            });

            // Leads closing dialokasikan ke closing dan revenue
            leadsClosedInRange.forEach(lead => {
                const gName = resolveGroupName(lead.ad_id, lead.ad_name);
                if (!groupedAds[gName]) groupedAds[gName] = { adName: gName, adIds: new Set(), total: 0, closing: 0, followUp: 0, lost: 0, revenue: 0, spend: 0 };
                if (lead.ad_id && lead.ad_id !== "Tidak ada ID" && lead.ad_id !== "Organic") groupedAds[gName].adIds.add(lead.ad_id);
                
                groupedAds[gName].closing += 1;
                groupedAds[gName].revenue += (parseInt(lead.nominal_closing || lead.nominal) || 0);
            });

            // Biaya iklan
            spendsInRange.forEach(spend => {
                const gName = resolveGroupName(spend.ad_id, null);
                if (!groupedAds[gName]) groupedAds[gName] = { adName: gName, adIds: new Set(), total: 0, closing: 0, followUp: 0, lost: 0, revenue: 0, spend: 0 };
                if (spend.ad_id) groupedAds[gName].adIds.add(spend.ad_id);
                groupedAds[gName].spend += spend.amount;
            });

                const roas = stat.spend > 0 ? (stat.revenue / stat.spend).toFixed(2) : (stat.revenue > 0 ? '∞' : '0.00');
                return { ...stat, adIdsArray: Array.from(stat.adIds), roas };

                                    <div className="overflow-x-auto"><table className="w-full text-left text-sm">
                                        <thead><tr className="border-b bg-gray-50 text-gray-600 text-xs uppercase"><th className="p-3">Tgl Laporan</th><th className="p-3">Konten Iklan</th><th className="p-3 text-right">Biaya (Rp)</th><th className="p-3 text-center">Aksi</th></tr></thead>
                                        <tbody>{adSpends.map(s => (<tr key={s.id} className="border-b"><td className="p-3 font-semibold">{s.date}</td><td className="p-3 font-medium text-gray-800">{getAdDisplayName(s.ad_id) || `ID: ${s.ad_id}`}<span className="block text-[10px] text-gray-400">ID Meta: {s.ad_id}</span></td><td className="p-3 text-right font-bold text-orange-600">{formatRupiah(s.amount)}</td><td className="p-3 text-center"><button onClick={() => handleDeleteSpend(s.id)} className="text-red-500 hover:text-red-700"><i className="ph ph-trash"></i></button></td></tr>))}</tbody>
                                    </table></div>
                                </div>
                            </div>

                        ) : (
                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start animate-fade-in">
                                <div className="lg:col-span-4 flex flex-col gap-4">
                                    <div className="bg-white rounded-2xl shadow-sm border border-gray-200"><div className="px-5 py-4 border-b bg-gray-50"><h2 className="font-semibold text-gray-700 flex items-center gap-2"><i className="ph ph-clipboard-text text-brand-600 text-lg"></i> Input Data Berdu</h2></div><div className="p-5"><textarea className="w-full border rounded-xl p-3 text-sm outline-none h-40 focus:ring-2 focus:ring-brand-500 transition-all" placeholder="Paste pesan WA pertama dari Berdu di sini..." value={rawText} onChange={handleTextChange}></textarea></div></div>
                                    {parsedData && (
                                        <div className="bg-white rounded-2xl shadow-sm border border-brand-200 overflow-hidden"><div className="px-5 py-3 bg-brand-50 border-b border-brand-100"><span className="text-sm font-bold text-brand-700 flex items-center gap-1.5"><i className="ph ph-magic-wand"></i> Hasil Ekstraksi Otomatis</span></div>
                                        <div className="p-5 space-y-4">
                                            <div className="bg-emerald-50/80 p-3 rounded-xl border border-emerald-100"><div className="flex items-start justify-between gap-2"><div><p className="text-xs text-emerald-700 font-medium">Nama Konten Iklan:</p>{getAdDisplayName(parsedData.ad_id) || parsedData.ad_name ? (<p className="font-bold text-gray-800 text-sm mt-0.5"><i className="ph-fill ph-film-strip text-emerald-600"></i> {getAdDisplayName(parsedData.ad_id) || parsedData.ad_name}</p>) : (<p className="text-xs text-red-500 italic mt-0.5 font-semibold">⚠️ Iklan baru, belum diberi nama</p>)}</div>{!getAdDisplayName(parsedData.ad_id) && !parsedData.ad_name && parsedData.ad_id !== "Tidak ada ID" && (<button onClick={() => setMappingModal({ open: true, adId: parsedData.ad_id, adName: '' })} className="text-[11px] bg-white text-emerald-700 border border-emerald-300 px-2.5 py-1.5 rounded-lg font-bold shadow-sm whitespace-nowrap">+ Beri Nama</button>)}</div></div>
                                            <div className="grid grid-cols-2 gap-3">
                                                <div><label className="text-[11px] font-bold text-gray-500 uppercase tracking-wide block mb-1">Sapaan</label><input type="text" value={parsedData.sapaan || ''} onChange={e => handleFieldChange('sapaan', e.target.value)} className="w-full border rounded-lg p-2.5 text-sm outline-none" placeholder="Bpk/Ibu/Kak"/></div>
                                                <div><label className="text-[11px] font-bold text-gray-500 uppercase tracking-wide block mb-1">Nama Lengkap</label><input type="text" value={parsedData.nama_lengkap || ''} onChange={e => handleFieldChange('nama_lengkap', e.target.value)} className="w-full border rounded-lg p-2.5 text-sm outline-none font-semibold text-gray-800" /></div>
                                                <div><label className="text-[11px] font-bold text-gray-500 uppercase tracking-wide block mb-1">No WhatsApp</label><input type="text" value={parsedData.no_wa || ''} onChange={e => handleFieldChange('no_wa', e.target.value)} className="w-full border rounded-lg p-2.5 text-sm outline-none font-medium text-blue-600" /></div>
                                                <div><label className="text-[11px] font-bold text-gray-500 uppercase tracking-wide block mb-1">Tgl Lead Masuk *</label><input type="date" value={parsedData.lead_date || ''} onChange={e => handleFieldChange('lead_date', e.target.value)} className="w-full border rounded-lg p-2.5 text-sm outline-none font-medium" /></div>
                                                <div><label className="text-[11px] font-bold text-gray-500 uppercase tracking-wide block mb-1">Nominal Awal</label><input type="text" value={parsedData.nominal || ''} onChange={e => handleFieldChange('nominal', e.target.value)} className="w-full border rounded-lg p-2.5 text-sm outline-none font-semibold text-gray-800" /></div>
                                                <div><label className="text-[11px] font-bold text-gray-500 uppercase tracking-wide block mb-1">Nama Orang Tua</label><input type="text" value={parsedData.nama_ortu || ''} onChange={e => handleFieldChange('nama_ortu', e.target.value)} className="w-full border rounded-lg p-2.5 text-sm outline-none" placeholder="Bin / Binti" /></div>
                                                <div className="col-span-2"><label className="text-[11px] font-bold text-gray-500 uppercase tracking-wide block mb-1">Tulis Doa Di Sini</label><textarea value={parsedData.doa || ''} onChange={e => handleFieldChange('doa', e.target.value)} className="w-full border rounded-lg p-2.5 text-sm h-20 resize-none outline-none text-gray-700 italic" placeholder="Doa donatur..."></textarea></div>
                                            </div>
                                            <button onClick={handleSave} className="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 mt-2"><i className="ph-bold ph-cloud-arrow-up text-lg"></i> Simpan Data Lead</button>
                                        </div></div>
                                    )}
                                </div>
                                <div className="lg:col-span-8">
                                    <div className="bg-white rounded-2xl shadow-sm border border-gray-200 h-full min-h-[600px] flex flex-col"><div className="px-6 py-4 border-b bg-gray-50 flex justify-between"><h2 className="font-semibold text-gray-700 flex items-center gap-2"><i className="ph ph-database text-brand-600 text-lg"></i> Database Leads ({leads.length})</h2></div>
                                        <div className="p-4 flex-1 overflow-auto bg-gray-50/50">
                                            <div className="space-y-4">
                                                {leads.map((lead) => {
                                                    const resolvedAdName = getAdDisplayName(lead.ad_id) || lead.ad_name;
                                                    return (
                                                        <div key={lead.id} className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm relative group hover:border-brand-300 transition-colors">
                                                            <button onClick={() => deleteLead(lead.id)} className="absolute top-4 right-4 text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all bg-white p-1 rounded-md shadow-sm"><i className="ph ph-trash text-lg"></i></button>
                                                            <div className="flex flex-col md:flex-row md:items-start justify-between gap-4"><div className="flex-1">
                                                                <div className="mb-2.5 flex items-center gap-2">{resolvedAdName ? (<span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-bold bg-brand-50 text-brand-700 border border-brand-200"><i className="ph-fill ph-megaphone text-brand-600"></i> {resolvedAdName}</span>) : (<button onClick={() => setMappingModal({ open: true, adId: lead.ad_id, adName: '' })} className="inline-flex items-center px-2.5 py-0.5 rounded-lg text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100 transition-colors">ID: {lead.ad_id} (+ Beri Nama)</button>)}</div>
                                                                <h3 className="font-bold text-gray-800 text-lg mb-1">{lead.sapaan ? `${lead.sapaan} ` : ''}{lead.nama_lengkap}</h3>
                                                                <p className="text-xs text-gray-500 mb-3 flex items-center gap-1.5"><i className="ph ph-calendar"></i> Tgl Lead: <strong className="text-gray-700">{lead.lead_date || lead.dateOnly}</strong></p>
                                                                
                                                                <div className="grid grid-cols-2 gap-4 text-sm bg-gray-50 p-3 rounded-xl border mb-3"><div><span className="block text-[10px] font-bold text-gray-400 uppercase tracking-wide">Nominal Awal</span><span className="font-bold text-gray-700">{formatRupiah(lead.nominal)}</span></div><div><span className="block text-[10px] font-bold text-gray-400 uppercase tracking-wide">No. WhatsApp</span><a href={`https://wa.me/${lead.no_wa?.replace(/^0/, '62')}`} target="_blank" className="font-bold text-blue-600 flex items-center gap-1 hover:underline"><i className="ph-fill ph-whatsapp-logo text-green-500"></i> {lead.no_wa}</a></div></div>
                                                                
                                                                {(lead.nama_ortu || lead.doa) && (
                                                                    <div className="text-sm bg-green-50/50 p-3 rounded-xl border border-green-100 mb-2 space-y-1.5">
                                                                        {lead.nama_ortu && <div className="flex gap-2"><span className="font-bold text-green-700 text-xs mt-0.5 w-10">Ortu:</span> <span className="text-gray-700 text-xs font-medium">{lead.nama_ortu}</span></div>}
                                                                        {lead.doa && <div className="flex gap-2"><span className="font-bold text-green-700 text-xs mt-0.5 w-10">Doa:</span> <span className="text-gray-700 text-xs italic">"{lead.doa}"</span></div>}
                                                                    </div>
                                                                )}

                                                                {lead.status === 'Closing' && (
                                                                    <div className="mt-3 bg-emerald-50 p-3 rounded-xl border border-emerald-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                                                        <div className="flex-1">
                                                                            <span className="block text-xs font-bold text-emerald-800">💰 Nominal & Tgl Closing</span>
                                                                            <span className="block text-[10px] text-emerald-600">Pastikan sesuai mutasi masuk</span>
                                                                        </div>
                                                                        <div className="flex items-center gap-2 w-full sm:w-auto">
                                                                            <input type="date" title="Tanggal Closing" value={lead.tanggal_closing || lead.lead_date || lead.dateOnly || ''} onChange={(e) => updateLeadData(lead.id, 'tanggal_closing', e.target.value)} className="w-full sm:w-auto border border-emerald-300 rounded-lg p-2.5 text-xs font-bold text-emerald-900 bg-white focus:ring-2 focus:ring-emerald-500 outline-none" />
                                                                            <input type="number" title="Nominal Aktual" value={lead.nominal_closing || lead.nominal || ''} onChange={(e) => updateLeadData(lead.id, 'nominal_closing', e.target.value)} className="w-full sm:w-36 border border-emerald-300 rounded-lg p-2.5 text-sm font-bold text-right text-emerald-900 bg-white focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="0"/>
                                                                        </div>
                                                                    </div>
                                                                )}
                                                            </div>
                                                            <div className="w-full md:w-52 shrink-0 flex flex-col gap-2"><label className="text-[11px] font-bold text-gray-500 uppercase tracking-wide">Status Lead</label>
                                                                <select value={lead.status} onChange={(e) => updateStatus(lead.id, e.target.value)} className={`w-full border rounded-xl p-3 text-sm font-bold outline-none shadow-sm cursor-pointer transition-colors ${lead.status === 'Follow Up' ? 'bg-yellow-50 text-yellow-700 border-yellow-200' : lead.status === 'Closing' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-red-50 text-red-700 border-red-200'}`}><option value="Follow Up">⏳ Follow Up</option><option value="Closing">✅ Closing (Donasi)</option><option value="Lost">❌ Lost (Batal)</option></select>
                                                            </div></div>
                                                        </div>
                                                    );
                                                })}
                                                {leads.length === 0 && <div className="text-center py-10 text-gray-400"><i className="ph ph-empty text-4xl mb-2"></i><p className="text-sm">Belum ada data leads.</p></div>}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {mappingModal.open && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl"><h3 className="text-xl font-bold text-gray-800 mb-1">Beri Nama Konten Iklan</h3><p className="text-xs text-gray-500 mb-4">ID Meta: <code className="bg-gray-100 px-1 rounded text-brand-600">{mappingModal.adId}</code></p><div className="mb-5"><label className="block text-[11px] font-bold text-gray-600 uppercase tracking-wide mb-1.5">Nama Iklan</label><input type="text" value={mappingModal.adName} onChange={e => setMappingModal(prev => ({ ...prev, adName: e.target.value }))} className="w-full border border-gray-300 focus:border-brand-500 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-brand-200 transition-all" autoFocus placeholder="Cth: Video Wakaf Sedekah 01"/></div><div className="flex justify-end gap-3"><button onClick={() => setMappingModal({ open: false, adId: '', adName: '' })} className="px-5 py-2.5 rounded-xl text-sm font-bold bg-gray-100 text-gray-600 hover:bg-gray-200 transition-colors">Batal</button><button onClick={handleQuickSaveMapping} className="px-5 py-2.5 rounded-xl text-sm font-bold bg-brand-600 text-white hover:bg-brand-700 shadow-md transition-colors">Simpan Nama</button></div></div>
                        </div>
                    )}
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

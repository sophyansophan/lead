<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Leads - Meta to Berdu</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Master ad mappings database
        const initialAdMappings = [
            { id: "120254757768970226", name: "Meta IG - Video Wakaf Pasir 01", platform: "Instagram" }
        ];

        // --- Helper Function: Parsing Logic dari Berdu ---
        const parseBerduText = (text, adMappings = []) => {
            let ad_id = "";
            let campaign_id = "";
            let rawUrl = "";
            
            // Extract URL and UTMs
            const urlRegex = /(https?:\/\/[^\s]+)/;
            const urlMatch = text.match(urlRegex);
            
            if (urlMatch) {
                rawUrl = urlMatch[0];
                try {
                    const urlObj = new URL(rawUrl);
                    ad_id = urlObj.searchParams.get('utm_content') || "Tidak ada ID";
                    campaign_id = urlObj.searchParams.get('utm_campaign') || "Tidak ada ID";
                } catch(e) {
                    console.error("URL Invalid", e);
                }
            }

            // Find mapped ad name
            const mappedAd = adMappings.find(m => m.id === ad_id);
            const ad_name = mappedAd ? mappedAd.name : null;

            // Helper to safely get regex group 1
            const extractLine = (regex) => {
                const match = text.match(regex);
                return match && match[1] ? match[1].trim() : "";
            }

            const rawNominal = extractLine(/Pilih Nominal Infaq Anda:\s*(.+)/);
            let nominalNumber = "";
            let kategori = "";

            if (rawNominal) {
                let parts = [];
                if (rawNominal.includes("—")) parts = rawNominal.split("—");
                else if (rawNominal.includes("-")) parts = rawNominal.split("-");
                else parts = [rawNominal];

                const numPart = parts[0];
                kategori = parts.length > 1 ? parts.slice(1).join("-").trim() : "Tidak spesifik";
                
                nominalNumber = numPart.replace(/\D/g, '');
            }

            return {
                ad_id,
                ad_name,
                campaign_id,
                kategori,
                nominal: nominalNumber,
                sapaan: extractLine(/Sapaan:\s*(.+)/),
                nama_lengkap: extractLine(/Nama Lengkap:\s*(.+)/),
                no_wa: extractLine(/No\. WhatsApp:\s*(.+)/),
                doa: extractLine(/Tulis Doa Di Sini:\s*(.+)/),
                nama_ortu: extractLine(/Nama Orang Tua:\s*(.+)/),
                rawUrl
            };
        };

        // --- Helper Function: CSV Parser (RFC 4180 standard) ---
        const parseCSV = (str) => {
            const arr = [];
            let quote = false;
            for (let row = 0, col = 0, c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || '';
                if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
                if (cc == '"') { quote = !quote; continue; }
                if (cc == ',' && !quote) { ++col; continue; }
                if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc == '\n' && !quote) { ++row; col = 0; continue; }
                if (cc == '\r' && !quote) { ++row; col = 0; continue; }
                arr[row][col] += cc;
            }
            return arr;
        };

        // --- Component: Notification Toast ---
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'success' ? 'bg-brand-600' : 'bg-red-500';
            const icon = type === 'success' ? 'ph-check-circle' : 'ph-warning-circle';

            return (
                <div className={`fixed bottom-4 right-4 ${bgColor} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 transition-all z-50 animate-bounce`}>
                    <i className={`${icon} text-xl`}></i>
                    <p className="font-medium text-sm">{message}</p>
                </div>
            );
        };

        const App = () => {
            // State
            const [leads, setLeads] = useState([]); // In-memory database for preview
            const [adMappings, setAdMappings] = useState(initialAdMappings);
            const [rawText, setRawText] = useState("");
            const [parsedData, setParsedData] = useState(null);
            const [toast, setToast] = useState(null);
            const [activeTab, setActiveTab] = useState('leads'); // 'leads', 'dashboard', 'ads_manager', 'ad_spend'
            
            // Ad Spend State
            const [adSpends, setAdSpends] = useState([]);
            const [isDragging, setIsDragging] = useState(false);

            // Filter Dashboard State
            const [filterStart, setFilterStart] = useState(() => {
                const d = new Date();
                d.setDate(1); 
                return d.toISOString().split('T')[0];
            });
            const [filterEnd, setFilterEnd] = useState(() => new Date().toISOString().split('T')[0]);

            // Modal state for quick ad mapping
            const [mappingModal, setMappingModal] = useState({ open: false, adId: '', adName: '' });

            // New Ad Mapping Form State
            const [newAdId, setNewAdId] = useState("");
            const [newAdName, setNewAdName] = useState("");
            const [newAdPlatform, setNewAdPlatform] = useState("Instagram");

            // Re-parse data if text or mappings change
            useEffect(() => {
                if (rawText.trim().length > 10) {
                    const extracted = parseBerduText(rawText, adMappings);
                    const now = new Date();
                    const todayStr = now.toISOString().split('T')[0];
                    setParsedData(prev => ({
                        ...extracted,
                        id: prev?.id || Date.now().toString(),
                        status: prev?.status || 'Follow Up',
                        lead_date: prev?.lead_date || todayStr,
                        date: prev?.date || now.toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
                        dateOnly: prev?.dateOnly || now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })
                    }));
                }
            }, [rawText, adMappings]);

            const handleTextChange = (e) => {
                const val = e.target.value;
                setRawText(val);
                if (val.trim().length > 10) {
                    const extracted = parseBerduText(val, adMappings);
                    const now = new Date();
                    const todayStr = now.toISOString().split('T')[0];
                    setParsedData({
                        ...extracted,
                        id: Date.now().toString(),
                        status: 'Follow Up',
                        lead_date: todayStr, // Default tanggal masuk adalah hari saat diinput
                        date: now.toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
                        dateOnly: now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })
                    });
                } else {
                    setParsedData(null);
                }
            };

            const handleAddAdMapping = (e) => {
                e?.preventDefault();
                if (!newAdId.trim() || !newAdName.trim()) {
                    setToast({ type: 'error', message: 'ID Iklan & Nama Iklan harus diisi!' });
                    return;
                }
                if (adMappings.some(m => m.id === newAdId.trim())) {
                    setAdMappings(prev => prev.map(m => m.id === newAdId.trim() ? { ...m, name: newAdName.trim(), platform: newAdPlatform } : m));
                    setToast({ type: 'success', message: 'Nama Iklan berhasil diperbarui!' });
                } else {
                    setAdMappings(prev => [...prev, { id: newAdId.trim(), name: newAdName.trim(), platform: newAdPlatform }]);
                    setToast({ type: 'success', message: 'Master Iklan berhasil ditambahkan!' });
                }
                setNewAdId("");
                setNewAdName("");
            };

            const handleQuickSaveMapping = () => {
                if (!mappingModal.adName.trim()) return;
                setAdMappings(prev => {
                    const exists = prev.some(m => m.id === mappingModal.adId);
                    if (exists) {
                        return prev.map(m => m.id === mappingModal.adId ? { ...m, name: mappingModal.adName.trim() } : m);
                    }
                    return [...prev, { id: mappingModal.adId, name: mappingModal.adName.trim(), platform: 'Meta Ads' }];
                });
                setToast({ type: 'success', message: `ID Iklan ${mappingModal.adId} berhasil diberi nama!` });
                setMappingModal({ open: false, adId: '', adName: '' });
            };

            const handleDeleteAdMapping = (id) => {
                setAdMappings(prev => prev.filter(m => m.id !== id));
                setToast({ type: 'success', message: 'Mapping Iklan dihapus.' });
            };

            // --- Import CSV Ads Manager (Dynamic Parser) ---
            const handleImportCSV = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const text = event.target.result;
                    const parsedData = parseCSV(text);
                    
                    if (parsedData.length < 2) {
                        setToast({ type: 'error', message: 'File CSV kosong atau format tidak valid.' });
                        return;
                    }

                    // 1. DYNAMIC HEADER DETECTION
                    // Mengakomodasi Bahasa Indonesia seperti: "Nama iklan", "ID Iklan", "Jumlah yang dibelanjakan (IDR)", "Awal pelaporan"
                    let headerRowIdx = -1;
                    let headers = [];
                    for (let i = 0; i < Math.min(parsedData.length, 5); i++) {
                        // Hilangkan karakter aneh Meta dan kecilkan huruf
                        const rowData = parsedData[i].map(h => h ? h.toString().toLowerCase().trim().replace(/[\u200B-\u200D\uFEFF]/g, '') : '');
                        
                        const hasAdId = rowData.some(h => h.includes('ad id') || h.includes('id iklan') || h === 'ad_id');
                        const hasSpend = rowData.some(h => h.includes('spent') || h.includes('spend') || h.includes('biaya') || h.includes('pengeluaran') || h.includes('amount') || h.includes('dibelanjakan'));
                        
                        if (hasAdId && hasSpend) {
                            headerRowIdx = i;
                            headers = rowData;
                            break;
                        }
                    }

                    if (headerRowIdx === -1) {
                        setToast({ type: 'error', message: 'Format tidak dikenali! Gagal menemukan kolom ID Iklan & Dibelanjakan.' });
                        return;
                    }

                    // 2. DAPATKAN INDEX KOLOM (Ditambahkan "awal pelaporan")
                    const dateIdx = headers.findIndex(h => h.includes('awal pelaporan') || h.includes('reporting starts') || h.includes('day') || h.includes('hari') || h.includes('tanggal') || h.includes('mulai pelaporan') || h === 'date');
                    const adIdIdx = headers.findIndex(h => h.includes('ad id') || h.includes('id iklan') || h === 'ad_id');
                    const spendIdx = headers.findIndex(h => h.includes('spent') || h.includes('spend') || h.includes('biaya') || h.includes('pengeluaran') || h.includes('amount') || h.includes('dibelanjakan'));
                    const adNameIdx = headers.findIndex(h => h.includes('ad name') || h.includes('nama iklan'));

                    if (adIdIdx === -1 || spendIdx === -1) {
                        setToast({ type: 'error', message: 'Kolom penting hilang! ID Iklan atau Dibelanjakan tidak ada di CSV.' });
                        return;
                    }

                    const newSpendsList = [];
                    const newMappingsList = [];
                    let importedCount = 0;

                    // 3. PROSES DATA BARIS PER BARIS
                    for (let i = headerRowIdx + 1; i < parsedData.length; i++) {
                        const row = parsedData[i];
                        if (row.length <= Math.max(adIdIdx, spendIdx)) continue;
                        
                        let adId = row[adIdIdx] ? row[adIdIdx].replace(/[^0-9]/g, '') : "";
                        if (!adId) continue; // Skip jika kosong (biasanya baris total)

                        // --- Parsing Tanggal Berdasarkan Kolom Meta ("Awal Pelaporan") ---
                        // Hilangkan jam/timestamp jika ada, pastikan fallback
                        let rawDate = (dateIdx !== -1 && row[dateIdx]) ? row[dateIdx].trim().split(' ')[0] : "";
                        
                        if (rawDate) {
                            if (rawDate.includes('/')) {
                                const parts = rawDate.split('/');
                                if(parts.length === 3) {
                                    if (parts[2].length === 4) { 
                                        // Meta ID sering pakai DD/MM/YYYY
                                        rawDate = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                                    } else if (parts[0].length === 4) { // Jika ternyata YYYY/MM/DD
                                        rawDate = `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
                                    }
                                }
                            } else if (rawDate.includes('-')) {
                                const parts = rawDate.split('-');
                                if (parts.length === 3) { 
                                    if (parts[2].length === 4) { // DD-MM-YYYY
                                        rawDate = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                                    } else if (parts[0].length === 4) { // Format YYYY-MM-DD sudah benar, dirapikan
                                        rawDate = `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
                                    }
                                }
                            }
                        } else {
                            // Fallback jika aneh
                            rawDate = new Date().toISOString().split('T')[0];
                        }

                        // --- Parsing Nominal Biaya (Aman untuk IDR dan format Ribuan/Desimal) ---
                        let rawSpend = row[spendIdx] ? row[spendIdx].toString() : "0";
                        rawSpend = rawSpend.replace(/[^0-9,.]/g, ''); // Hapus text/spasi/rp, sisakan angka & tanda baca
                        
                        if (rawSpend.includes(',') && rawSpend.includes('.')) {
                            if (rawSpend.indexOf(',') > rawSpend.indexOf('.')) { // 150.000,50
                                rawSpend = rawSpend.replace(/\./g, '').replace(',', '.');
                            } else { // 150,000.50
                                rawSpend = rawSpend.replace(/,/g, '');
                            }
                        } else if (rawSpend.includes(',')) {
                            if (rawSpend.match(/,\d{1,2}$/)) { // 150000,50
                                rawSpend = rawSpend.replace(',', '.');
                            } else { // 150,000
                                rawSpend = rawSpend.replace(/,/g, '');
                            }
                        } else if (rawSpend.includes('.')) {
                            if (rawSpend.match(/\.\d{3,}$/)) { // 150.000 (Ribuan Format Indo)
                                rawSpend = rawSpend.replace(/\./g, '');
                            }
                        }
                        
                        const spendVal = parseFloat(rawSpend) || 0;
                        let adName = (adNameIdx !== -1 && row[adNameIdx]) ? row[adNameIdx].trim() : "";

                        if (spendVal >= 0) {
                            newSpendsList.push({
                                id: Date.now().toString() + Math.random().toString(36).substring(2, 9),
                                date: rawDate,
                                ad_id: adId,
                                amount: spendVal
                            });
                            importedCount++;
                        }

                        // Auto-Mapping Nama Iklan
                        if (adId && adName) {
                            newMappingsList.push({ id: adId, name: adName, platform: 'Meta Ads' });
                        }
                    }

                    if (importedCount > 0) {
                        setAdSpends(prev => {
                            let updatedList = [...prev];
                            newSpendsList.forEach(newSpend => {
                                updatedList = updatedList.filter(p => !(p.date === newSpend.date && p.ad_id === newSpend.ad_id));
                                updatedList.push(newSpend);
                            });
                            return updatedList;
                        });

                        if (newMappingsList.length > 0) {
                            setAdMappings(prev => {
                                let mappedList = [...prev];
                                newMappingsList.forEach(newMap => {
                                    if (!mappedList.some(m => m.id === newMap.id)) {
                                        mappedList.push(newMap);
                                    }
                                });
                                return mappedList;
                            });
                        }

                        setToast({ type: 'success', message: `${importedCount} baris data biaya otomatis terimport (Tgl Awal Pelaporan)` });
                    } else {
                        setToast({ type: 'error', message: 'Data CSV tidak memiliki angka valid atau format salah.' });
                    }
                };
                reader.readAsText(file);
                e.target.value = null; // Reset input file
            };

            const handleDeleteSpend = (id) => {
                setAdSpends(prev => prev.filter(s => s.id !== id));
                setToast({ type: 'success', message: 'Data biaya dihapus.' });
            };

            const handleFieldChange = (field, value) => {
                setParsedData(prev => ({ ...prev, [field]: value }));
            };

            const handleSave = () => {
                if (!parsedData.nama_lengkap || !parsedData.no_wa) {
                    setToast({ type: 'error', message: 'Nama Lengkap & No WhatsApp wajib terisi!' });
                    return;
                }
                
                const mapped = adMappings.find(m => m.id === parsedData.ad_id);
                const finalData = {
                    ...parsedData,
                    ad_name: mapped ? mapped.name : (parsedData.ad_name || null),
                    nominal_closing: ""
                };
                
                setLeads(prev => [finalData, ...prev]);
                setRawText("");
                setParsedData(null);
                setToast({ type: 'success', message: 'Lead berhasil didata!' });
            };

            const updateStatus = (id, newStatus) => {
                setLeads(prev => prev.map(lead => {
                    if (lead.id === id) {
                        const updated = { ...lead, status: newStatus };
                        if (newStatus === 'Closing' && !lead.nominal_closing) {
                            updated.nominal_closing = lead.nominal;
                        }
                        return updated;
                    }
                    return lead;
                }));
            };

            const updateLeadData = (id, field, value) => {
                setLeads(prev => prev.map(lead =>
                    lead.id === id ? { ...lead, [field]: value } : lead
                ));
            };

            const deleteLead = (id) => {
                setLeads(prev => prev.filter(lead => lead.id !== id));
                setToast({ type: 'success', message: 'Lead dihapus.' });
            };

            const getAdDisplayName = (adId) => {
                const found = adMappings.find(m => m.id === adId);
                return found ? found.name : null;
            };

            // --- DASHBOARD METRICS CALCULATION ---
            const filteredLeads = leads.filter(lead => {
                const lDate = lead.lead_date || lead.dateOnly; 
                if (filterStart && lDate < filterStart) return false;
                if (filterEnd && lDate > filterEnd) return false;
                return true;
            });

            const filteredSpends = adSpends.filter(spend => {
                if (filterStart && spend.date < filterStart) return false;
                if (filterEnd && spend.date > filterEnd) return false;
                return true;
            });

            const totalLeads = filteredLeads.length;
            const totalClosing = filteredLeads.filter(l => l.status === 'Closing').length;
            const totalFollowUp = filteredLeads.filter(l => l.status === 'Follow Up').length;
            const totalLost = filteredLeads.filter(l => l.status === 'Lost').length;
            const totalRevenue = filteredLeads.filter(l => l.status === 'Closing').reduce((acc, l) => acc + (parseInt(l.nominal_closing) || 0), 0);
            
            const totalAdSpend = filteredSpends.reduce((acc, s) => acc + s.amount, 0);
            const totalROAS = totalAdSpend > 0 ? (totalRevenue / totalAdSpend).toFixed(2) : (totalRevenue > 0 ? '∞' : '0.00');

            const allDates = new Set([
                ...filteredLeads.map(l => l.lead_date || l.dateOnly || "Tanpa Tanggal"),
                ...filteredSpends.map(s => s.date)
            ]);

            const dateStats = Array.from(allDates).filter(Boolean).map(dateKey => {
                const l = filteredLeads.filter(x => (x.lead_date || x.dateOnly || "Tanpa Tanggal") === dateKey);
                const s = filteredSpends.filter(x => x.date === dateKey);
                
                const total = l.length;
                const closing = l.filter(x => x.status === 'Closing').length;
                const followUp = l.filter(x => x.status === 'Follow Up').length;
                const lost = l.filter(x => x.status === 'Lost').length;
                const revenue = l.filter(x => x.status === 'Closing').reduce((acc, x) => acc + (parseInt(x.nominal_closing) || 0), 0);
                const spend = s.reduce((acc, x) => acc + x.amount, 0);
                const roas = spend > 0 ? (revenue / spend).toFixed(2) : (revenue > 0 ? '∞' : '0.00');

                return { date: dateKey, total, closing, followUp, lost, revenue, spend, roas };
            }).sort((a, b) => new Date(b.date) - new Date(a.date));

            const allAdIds = new Set([
                ...filteredLeads.map(l => l.ad_id),
                ...filteredSpends.map(s => s.ad_id)
            ]);

            const adStats = Array.from(allAdIds).filter(Boolean).map(adKey => {
                const l = filteredLeads.filter(x => x.ad_id === adKey);
                const s = filteredSpends.filter(x => x.ad_id === adKey);
                
                const total = l.length;
                const closing = l.filter(x => x.status === 'Closing').length;
                const followUp = l.filter(x => x.status === 'Follow Up').length;
                const lost = l.filter(x => x.status === 'Lost').length;
                const revenue = l.filter(x => x.status === 'Closing').reduce((acc, x) => acc + (parseInt(x.nominal_closing) || 0), 0);
                const spend = s.reduce((acc, x) => acc + x.amount, 0);
                const roas = spend > 0 ? (revenue / spend).toFixed(2) : (revenue > 0 ? '∞' : '0.00');

                return { 
                    adId: adKey, 
                    adName: getAdDisplayName(adKey) || (l[0]?.ad_name) || "Belum Terpetakan", 
                    total, closing, followUp, lost, revenue, spend, roas 
                };
            }).sort((a, b) => b.total - a.total);


            const formatRupiah = (angka) => {
                if (!angka) return "0";
                return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
            };

            return (
                <div className="min-h-screen flex flex-col bg-gray-100">
                    {/* Header & Navigation */}
                    <header className="bg-white border-b border-gray-200 sticky top-0 z-10 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-brand-100 p-2.5 rounded-xl text-brand-600">
                                    <i className="ph-fill ph-megaphone text-2xl"></i>
                                </div>
                                <div>
                                    <h1 className="font-bold text-gray-800 text-lg flex items-center gap-2">
                                        Meta-Berdu CRM Leads
                                        <span className="text-xs bg-brand-100 text-brand-700 px-2 py-0.5 rounded-full font-semibold">Auto Ad Mapper</span>
                                    </h1>
                                    <p className="text-xs text-gray-500">Pendataan Lead & Pemetaan Konten Iklan Meta</p>
                                </div>
                            </div>
                            
                            {/* Navigation Tabs */}
                            <div className="flex items-center gap-2 bg-gray-100 p-1 rounded-xl overflow-x-auto w-full md:w-auto">
                                <button
                                    onClick={() => setActiveTab('dashboard')}

                                                    </div>
                                                </div>
                                                
                                                <div className="grid grid-cols-2 gap-3">
                                                    <div>
                                                        <label className="text-xs text-gray-500 mb-1 block">Tgl Lead Masuk *</label>
                                                        <input type="date" value={parsedData.lead_date} onChange={e => handleFieldChange('lead_date', e.target.value)} className="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none cursor-pointer text-gray-700" />
                                                    </div>
                                                    <div>
                                                        <label className="text-xs text-gray-500 mb-1 block">Nominal (Angka)</label>
                                                        <input type="text" value={parsedData.nominal} onChange={e => handleFieldChange('nominal', e.target.value)} className="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none" />
                                                    </div>
                                                </div>

                                                <button onClick={handleSave} className="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-xl transition-colors shadow-sm flex items-center justify-center gap-2">
                                                    <i className="ph ph-floppy-disk"></i> Simpan Data Lead
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="lg:col-span-8">
                                    <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden h-full min-h-[500px] flex flex-col">
                                        <div className="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-gray-50">
                                            <h2 className="font-semibold text-gray-700 flex items-center gap-2">
                                                <i className="ph ph-database text-brand-600 text-lg"></i> Database Leads ({leads.length})
                                            </h2>
                                        </div>
                                        <div className="p-4 flex-1 overflow-auto bg-gray-50/50">
                                            {leads.length === 0 ? (
                                                <div className="h-full flex flex-col items-center justify-center text-gray-400 py-16">
                                                    <i className="ph ph-empty text-5xl mb-3"></i>
                                                    <p className="text-sm font-medium">Belum ada lead yang didata.</p>
                                                </div>
                                            ) : (
                                                <div className="space-y-4">
                                                    {leads.map((lead) => {
                                                        const resolvedAdName = getAdDisplayName(lead.ad_id) || lead.ad_name;
                                                        return (
                                                            <div key={lead.id} className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm relative group">
                                                                <button onClick={() => deleteLead(lead.id)} className="absolute top-4 right-4 text-gray-400 hover:text-red-500 opacity-0 group-hover:opacity-100"><i className="ph ph-trash text-lg"></i></button>

                                                                <div className="flex flex-col md:flex-row md:items-start justify-between gap-4">
                                                                    <div className="flex-1">
                                                                        <div className="mb-2.5 flex items-center gap-2 flex-wrap">
                                                                            {resolvedAdName ? (
                                                                                <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-bold bg-brand-50 text-brand-700 border border-brand-200"><i className="ph-fill ph-megaphone text-brand-600"></i> {resolvedAdName}</span>
                                                                            ) : (
                                                                                <button onClick={() => setMappingModal({ open: true, adId: lead.ad_id, adName: '' })} className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-lg text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200"><i className="ph ph-warning-circle"></i> ID: {lead.ad_id} (+ Nama Iklan)</button>
                                                                            )}
                                                                        </div>

                                                                        <h3 className="font-bold text-gray-800 text-lg mb-1">{lead.sapaan ? `${lead.sapaan} ` : ''}{lead.nama_lengkap}</h3>
                                                                        <p className="text-xs text-gray-500 mb-3"><i className="ph ph-calendar"></i> Tanggal Lead Masuk: <strong>{lead.lead_date || lead.dateOnly}</strong></p>

                                                                        <div className="grid grid-cols-2 gap-4 text-sm bg-gray-50 p-3 rounded-lg border border-gray-100">
                                                                            <div>
                                                                                <span className="block text-xs text-gray-400">Nominal Awal</span>
                                                                                <span className="font-semibold text-gray-800">{formatRupiah(lead.nominal)}</span>
                                                                            </div>
                                                                            <div>
                                                                                <span className="block text-xs text-gray-400">No. WhatsApp</span>
                                                                                <span className="font-semibold text-blue-600">{lead.no_wa}</span>
                                                                            </div>
                                                                        </div>

                                                                        {lead.status === 'Closing' && (
                                                                            <div className="mt-3 bg-emerald-50 p-3 rounded-lg border border-emerald-200 flex items-center justify-between gap-3">
                                                                                <div>
                                                                                    <span className="block text-xs font-bold text-emerald-700 mb-0.5">Nominal Closing Aktual</span>
                                                                                    <span className="text-[10px] text-emerald-600">Ubah jika donasi berbeda dari awal</span>
                                                                                </div>
                                                                                <input type="number" value={lead.nominal_closing || ''} onChange={(e) => updateLeadData(lead.id, 'nominal_closing', e.target.value)} className="w-32 border border-emerald-300 rounded-lg p-2 text-sm font-semibold text-right outline-none" placeholder="0"/>
                                                                            </div>
                                                                        )}
                                                                    </div>

                                                                    <div className="w-full md:w-48 shrink-0 flex flex-col gap-2">
                                                                        <label className="text-xs font-semibold text-gray-500">Status Lead</label>
                                                                        <select value={lead.status} onChange={(e) => updateStatus(lead.id, e.target.value)} className={`w-full border rounded-xl p-2.5 text-sm font-semibold outline-none ${lead.status === 'Follow Up' ? 'bg-yellow-50 text-yellow-700' : lead.status === 'Closing' ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'}`}>
                                                                            <option value="Follow Up">⏳ Follow Up</option>
                                                                            <option value="Closing">✅ Closing</option>
                                                                            <option value="Lost">❌ Lost</option>
                                                                        </select>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Modal */}
                    {mappingModal.open && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl w-full max-w-md p-6">
                                <h3 className="text-lg font-bold text-gray-800 mb-4">Beri Nama Iklan</h3>
                                <div className="mb-4">
                                    <label className="block text-xs font-semibold text-gray-700 mb-1">Nama Konten Iklan</label>
                                    <input type="text" value={mappingModal.adName} onChange={e => setMappingModal(prev => ({ ...prev, adName: e.target.value }))} className="w-full border border-gray-300 rounded-xl p-2.5 text-sm outline-none" autoFocus/>
                                </div>
                                <div className="flex justify-end gap-2">
                                    <button onClick={() => setMappingModal({ open: false, adId: '', adName: '' })} className="px-4 py-2 rounded-xl text-xs font-semibold text-gray-600 bg-gray-100">Batal</button>
                                    <button onClick={handleQuickSaveMapping} className="px-4 py-2 rounded-xl text-xs font-semibold bg-brand-600 text-white">Simpan</button>
                                </div>
                            </div>
                        </div>
                    )}
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
